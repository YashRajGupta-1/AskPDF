<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>RAG PDF QA</title></head>
<body style="font-family: sans-serif; max-width: 800px; margin: 2em auto;">
<h2>RAG PDF QA</h2>
<input type="file" id="file" accept=".pdf">
<button onclick="upload()">Upload &amp; index</button>
<p id="upstatus"></p>
<hr>
<input id="q" placeholder="Ask a question..." size="60">
<button onclick="ask()">Ask</button>
<div id="answer" style="margin-top:1em;"></div>
<script>
let docId = null;
async function upload() {
  const f = document.getElementById('file').files[0];
  if (!f) return alert("choose a PDF first");
  const fd = new FormData();
  fd.append('file', f);
  const j = await (await fetch('/documents', {method:'POST', body: fd})).json();
  docId = j.doc_id;
  document.getElementById('upstatus').textContent = "Indexing... (takes ~a minute)";
  poll();
}
async function poll() {
  const j = await (await fetch(`/documents/${docId}/status`)).json();
  if (j.status === "ready")
    document.getElementById('upstatus').textContent = "Ready — ask away.";
  else if (j.status.startsWith("error"))
    document.getElementById('upstatus').textContent = j.status;
  else setTimeout(poll, 2000);
}
async function ask() {
  const q = document.getElementById('q').value;
  const j = await (await fetch('/ask', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({doc_id: docId, question: q})})).json();
  let html = `<p>${j.answer}</p><h4>Sources</h4><ul>`;
  for (const c of j.citations) html += `<li>[${c.n}] page ${c.page} — ${c.snippet}…</li>`;
  document.getElementById('answer').innerHTML = html + "</ul>";
}
</script>
</body>
</html>
